server:
  port: 8081

spring:
  application:
    name: taskflowBack

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: postgres
    password: rootroot
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/taskflow
