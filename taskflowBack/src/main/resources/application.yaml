server:
  port: ${PORT:8081}
 
spring:
  application:
    name: taskflowBack
  config:
    import: optional:file:.env[.properties]   # lit .env en local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}
 
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
 
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
 
springdoc:
  swagger-ui:
    path: /swagger-ui.html