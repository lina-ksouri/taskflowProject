server:
  port: 8081

spring:
  application:
    name: taskflowBack

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: postgres
    password: rootroot

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # le schéma vient de Flyway ; mettez "update" si vous n'avez pas encore de migration
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/taskflow

app:
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html