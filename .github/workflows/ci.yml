# Intégration continue : à chaque push et pull request, on compile les deux projets
# et on exécute tous les tests. Le déploiement (Render) est déclenché seulement si
# cette CI réussit : voir "autoDeployTrigger: checksPass" dans render.yaml.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (compilation + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflowBack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compiler et lancer les tests
        run: mvn -B verify

  frontend:
    name: Frontend (compilation + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: taskflow-front/package-lock.json
      - run: npm ci
      - name: Compiler (vérification des types + build)
        run: npm run build
      - name: Tests
        run: npm test

  docker:
    name: Docker Compose (démarrage complet)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Créer le .env à partir de l'exemple
        run: cp .env.example .env
      - name: Valider le fichier compose
        run: docker compose config -q
      - name: Démarrer toute la pile
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Vérifier l'API (health check)
        run: curl -fsS http://localhost:8081/actuator/health
      - name: Vérifier que le realm a bien été importé
        run: curl -fsS http://localhost:8180/realms/taskflow
      - name: Vérifier que l'API refuse les requêtes sans jeton
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/me)
          echo "HTTP $code"
          test "$code" = "401"
      - name: Vérifier le frontend
        run: curl -fsS http://localhost:5173/ | grep -qi "<div id=\"app\""
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Arrêt
        if: always()
        run: docker compose down -v
